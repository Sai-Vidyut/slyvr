name: Notify buildwsai to redeploy /slyvr/

# Emits repository_dispatch → Sai-Vidyut/buildwsai (event-type: slyvr-updated)
# so the portfolio Pages workflow rebuilds and nests the latest Slyvr frontend.
#
# Cross-repo workflow triggers cannot use this repository's GITHUB_TOKEN.
# Instant notify requires a fine-grained PAT stored as the Actions secret
# BUILDWSAI_DISPATCH_TOKEN (Contents: Read and write on Sai-Vidyut/buildwsai).
# If the secret is unset, this job exits successfully; buildwsai's scheduled
# workflow still picks up Slyvr/main within ~15 minutes (no secret required).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify-buildwsai
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch slyvr-updated to buildwsai
        env:
          TOKEN: ${{ secrets.BUILDWSAI_DISPATCH_TOKEN }}
          SLYVR_SHA: ${{ github.sha }}
          SLYVR_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [ -z "${TOKEN:-}" ]; then
            echo "BUILDWSAI_DISPATCH_TOKEN is not configured."
            echo "Skipping instant repository_dispatch."
            echo "buildwsai will still nest this Slyvr commit via its 15-minute schedule (no secret required)."
            echo "For push-triggered deploys, add a fine-grained PAT secret named BUILDWSAI_DISPATCH_TOKEN"
            echo "with Contents: Read and write on Sai-Vidyut/buildwsai."
            exit 0
          fi

          echo "Dispatching slyvr-updated to Sai-Vidyut/buildwsai for $SLYVR_SHA"

          HTTP_CODE="$(curl -sS -o /tmp/dispatch-response.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Sai-Vidyut/buildwsai/dispatches \
            -d "$(jq -nc \
              --arg event_type "slyvr-updated" \
              --arg sha "$SLYVR_SHA" \
              --arg ref "$SLYVR_REF" \
              '{event_type:$event_type, client_payload:{sha:$sha, ref:$ref, repository:"Sai-Vidyut/slyvr"}}')")"

          echo "GitHub API status: $HTTP_CODE"
          cat /tmp/dispatch-response.json || true
          echo

          if [ "$HTTP_CODE" != "204" ]; then
            echo "repository_dispatch failed with HTTP $HTTP_CODE" >&2
            exit 1
          fi

          echo "Dispatched successfully. buildwsai Pages deploy should start shortly."
